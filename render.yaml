services:
  - type: web
    name: finova
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: finova-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: FRONTEND_URL
        sync: false

databases:
  - name: finova-db
    plan: free
    databaseName: finova